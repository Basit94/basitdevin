<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#072f4f"><title>Shrimp Fins Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>.admin{min-height:100vh;background:#f5f8fa}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#174f75,transparent 35%),#031e33}.login-card{width:min(430px,92%);background:#fff;border-radius:28px;padding:32px;box-shadow:var(--shadow)}.login-card h1{color:var(--navy);font-size:36px;margin:8px 0}.login-card label,.panel label{display:flex;flex-direction:column;gap:6px;margin:12px 0;color:#53636f;font-size:12px;font-weight:800}.login-card input,.panel input,.panel select{padding:12px;border:1px solid var(--line);border-radius:12px}.admin-shell{display:grid;grid-template-columns:240px 1fr}.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--navy2);padding:22px;color:#fff}.side .brand{color:#fff;margin-bottom:30px}.side button{width:100%;border:0;background:transparent;color:#b6cad7;padding:12px;text-align:left;border-radius:12px;font-weight:800;cursor:pointer}.side button.active,.side button:hover{background:rgba(255,255,255,.1);color:#fff}.workspace{grid-column:2;padding:28px}.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.admin-head h1{color:var(--navy)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;color:var(--navy);font-size:30px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:15px;overflow:auto}.panel-head{display:flex;align-items:center;justify-content:space-between}.panel h2{color:var(--navy)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{color:#7c8993}.pill{padding:5px 8px;border-radius:99px;background:#fff1e7;color:#b65c22;font-weight:900}.actions{display:flex;gap:5px}.actions button{border:0;padding:7px 9px;border-radius:9px;cursor:pointer;font-weight:800}.yes{background:#e8f8f1;color:#137b55}.no{background:#fdeaea;color:#aa3838}.tab{display:none}.tab.active{display:block}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.save{border:0;background:var(--orange);color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}.hidden{display:none!important}@media(max-width:900px){.admin-shell{display:block}.side{position:static;width:auto;display:flex;align-items:center;gap:5px;overflow:auto}.side .brand{margin:0 15px 0 0}.side button{width:auto;white-space:nowrap}.workspace{padding:15px}.cards{grid-template-columns:1fr 1fr}.settings-grid{grid-template-columns:1fr}}}</style></head><body class="admin"><section id="login" class="login"><form id="loginForm" class="login-card"><span class="eyebrow">RESTAURANT OPERATIONS</span><h1>Shrimp Fins</h1><p>Secure admin control center.</p><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="checkout">Sign in</button><p id="loginErr" style="color:#b33"></p></form></section><section id="app" class="admin-shell hidden"><aside class="side"><a class="brand" href="/"><span class="mark">🦐</span><div><b>Shrimp Fins</b><small>Operations</small></div></a><button class="nav active" data-tab="dashboard">Dashboard</button><button class="nav" data-tab="orders">Orders</button><button class="nav" data-tab="products">Products</button><button class="nav" data-tab="offers">Offers</button><button class="nav" data-tab="settings">Settings</button><button id="logout">Logout</button></aside><main class="workspace"><div class="admin-head"><div><span class="eyebrow">LIVE RESTAURANT CONTROL</span><h1 id="title">Dashboard</h1></div><a class="secondary" href="/" target="_blank">Open Store</a></div><section id="dashboard" class="tab active"><div class="cards"><div class="metric"><span>Today's Orders</span><b id="mOrders">0</b></div><div class="metric"><span>Today's Sales</span><b id="mSales">0</b></div><div class="metric"><span>Pending</span><b id="mPending">0</b></div><div class="metric"><span>Products</span><b id="mProducts">0</b></div></div><div class="panel"><div class="panel-head"><h2>Recent orders</h2><button class="save" onclick="loadDash()">Refresh</button></div><div id="recent"></div></div></section><section id="orders" class="tab"><div class="panel"><div class="panel-head"><h2>Orders</h2><button class="save" onclick="loadOrders()">Refresh</button></div><div id="ordersTable"></div></div></section><section id="products" class="tab"><div class="panel"><div class="panel-head"><h2>Products</h2><button class="save" id="addProduct">Add Product</button></div><div id="productsTable"></div></div></section><section id="offers" class="tab"><div class="panel"><div class="panel-head"><h2>Offers</h2></div><div id="offersTable"></div></div></section><section id="settings" class="tab"><div class="panel"><h2>Restaurant Settings</h2><form id="settingsForm" class="settings-grid"><label>Restaurant Arabic<input id="sNameAr"></label><label>Restaurant English<input id="sNameEn"></label><label>Phone<input id="sPhone"></label><label>WhatsApp<input id="sWa"></label><label>Delivery Fee<input id="sFee" type="number" step=".01"></label><label>Minimum Order<input id="sMin" type="number" step=".01"></label><label>Accepting Orders<select id="sOpen"><option value="true">Yes</option><option value="false">No</option></select></label><div><button class="save" type="submit">Save Settings</button></div></form></div></section></main></section><div id="toast" class="toast"></div><script src="/admin.js"></script></body></html>
