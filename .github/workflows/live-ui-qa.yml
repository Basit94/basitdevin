name: Live UI QA
# post-deploy mobile overflow verification
# verify deployed 0826
# manual production verification after v11

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # post-image-fallback production verification
  # verified production recheck after 82b8
  # post-deploy live verification v11
  # production recheck after deployment
  live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact commit to reach production
        env:
          BASE_URL: https://shrimp-fins-app-production.up.railway.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL,expected=process.env.EXPECTED_SHA,deadline=Date.now()+12*60*1000;
          (async()=>{
            while(Date.now()<deadline){
              try{
                const r=await fetch(base+'/api/version',{cache:'no-store'});
                const j=await r.json();
                console.log('production build',j.build,'expected',expected);
                if(r.ok&&j.build===expected) return;
              }catch(e){console.log('waiting for deployment:',e.message)}
              await new Promise(r=>setTimeout(r,10000));
            }
            throw new Error('Exact Git commit was not deployed before live UI QA timeout');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run deep live customer/admin browser QA
        env:
          BASE_URL: https://shrimp-fins-app-production.up.railway.app
          QA_OUT: qa-artifacts
        run: node scripts/live-ui-qa.cjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
