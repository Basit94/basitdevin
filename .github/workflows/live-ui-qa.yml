name: Live UI QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run deep live customer/admin browser QA
        env:
          BASE_URL: https://shrimp-fins-app-production.up.railway.app
          QA_OUT: qa-artifacts
        run: node scripts/live-ui-qa.cjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
