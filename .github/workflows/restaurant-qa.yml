name: Restaurant Full QA
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shrimpfins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shrimpfins_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shrimpfins_test
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm install
      - name: JavaScript syntax checks
        run: npm run check
      - name: Full customer and admin smoke test
        run: node scripts/ci-smoke.js
